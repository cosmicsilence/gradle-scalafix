name: master
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Run unit tests
        run: ./gradlew test
  compat_tests_java8_11:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java_version:
          - "8"
          - "11"
        gradle_version:
          - "4.10.3"
          - "5.1.1"
          - "5.6.4"
          - "6.0.1"
          - "6.9.4"
          - "7.0.2"
          - "7.6.6"
          - "8.0.2"
          - "8.14.5"
    steps:
      - name: Download repo
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11' # Version required to run the `./gradlew` command
      - name: Run Gradle compat tests for Gradle ${{ matrix.gradle_version }} on Java ${{ matrix.java_version }}
        run: ./gradlew compatTestJava${{ matrix.java_version }}Gradle${{ matrix.gradle_version }} --stacktrace
  compat_tests_java17:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle_version:
          - "7.3.3"
          - "7.6.6"
          - "8.0.2"
          - "8.14.5"
          - "9.0.0"
          - "9.7.1"
    steps:
      - name: Download repo
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11' # Version required to run the `./gradlew` command
      - name: Run Gradle compat tests for Gradle ${{ matrix.gradle_version }} on Java 17
        run: ./gradlew compatTestJava17Gradle${{ matrix.gradle_version }} --stacktrace
